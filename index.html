<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="bg-version" content="e460a211">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /* バグる Owner の中から開いたとき（?from=owner）だけ、viewport-fit=cover を外す（2026-11-01。予約ボードと同じ）。
     iPhone のホーム画面のアプリで別のページへ移ると、cover のままでは、使える高さが時計の帯のぶん短いのに上の端が時計の下にもぐり、
     下にすき間ができて全体が上に寄る。ホーム画面から直接開くときは、今までのまま。くわしくは バグる Owner の README */
  (function () {
    var owner = /[?&]from=owner\b/.test(location.search);
    try { owner = owner || sessionStorage.getItem('bg.fromOwner') === '1'; } catch (e) {}
    if (!owner) return;
    // テスト用アカウントの印（js/db.js が保存の箱を替える。マネージの「アプリで見る」の中では付けない）
    window.OWNER_TEST = !(window.parent !== window && /[?&]preview\b/.test(location.search));
    var v = document.querySelector('meta[name="viewport"]');
    v.setAttribute('content', v.getAttribute('content').replace(/,\s*viewport-fit=cover/, ''));
    addEventListener('pageshow', function (e) { if (!e.persisted) scrollTo(0, 0); });   // 切り替えたときのずれが残らないように
  })();
</script>
<meta name="robots" content="noindex, nofollow">   <!-- 試作のあいだは検索に出さない（2026-10-29 決定。本番で外す） -->
<meta name="theme-color" content="#1f1916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バグる">
<title>炭焼ハンバーグ バグる</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<!-- 字の形はホームページと同じ（2026-10-30）。読めないときは、スマホの字で出る -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <main id="view"></main>

         メニューは店内のメニュー（上の切りかえでテイクアウトも見られる）、注文はテイクアウトの注文 -->
    <a href="#home" data-tab="home" data-icon="home"><span>ホーム</span></a>
    <a href="#menu/dine" data-tab="menu" data-icon="menu"><span>メニュー</span></a>
    <a href="#menu" data-tab="order" data-icon="bag"><span>注文</span></a>
    <a href="#reserve" data-tab="reserve" data-icon="cal"><span>予約</span></a>
    <a href="#stamp" data-tab="stamp" data-icon="card"><span>スタンプ</span></a>
    <a href="#shop" data-tab="shop" data-icon="pin"><span>お店</span></a>
