<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="bg-version" content="95141725">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 読んでよい場所を限る（CSP。2026-11-05 お店用アプリの引っ越しの段階1・案4。計画書 `お店用アプリの引っ越し.md`）。GitHub Pages は見出しを付けられないので meta。
     script：自分の場所・予約ボードの config.js と api.js（同じ t3dining.github.io）・QR の部品（cdnjs・jsDelivr。SRI つき）だけ。中に書いたスクリプトは使わない（js/owner-head.js などに出した）
     style：字の形（Google Fonts）と、画面の中の style の書き方（'unsafe-inline'）／img：写真（lh3）と、QR の絵（data:）／connect：受け口（script.google.com とその転送先）と T3Works の営業日
     frame：お店の情報の地図（Google マップ）。★外の場所を足したら、ここも直す（直さないと、その部品は読まれない） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://t3dining.github.io https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://t3works-sync.t3dining.workers.dev; frame-src https://www.google.com https://maps.google.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="js/owner-head.js?v=a53475a6"></script>   <!-- バグる Owner から開いたときだけのこと（前はここに中身を書いていた） -->
<meta name="robots" content="noindex, nofollow">   <!-- 試作のあいだは検索に出さない（2026-10-29 決定。本番で外す） -->
<meta name="theme-color" content="#1f1916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バグる">
<title>炭焼ハンバーグ バグる</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<!-- 字の形はホームページと同じ（2026-10-30）。読めないときは、スマホの字で出る -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/app.css?v=6dbb75b4">
</head>
<body>
<div class="app">
  <header class="top">
    <button id="back" class="top-btn" hidden aria-label="戻る" data-icon="back"></button>
    <h1 id="title"></h1>
    <button id="ownerHome" class="owner-home" hidden>🏠 ホーム</button>   <!-- バグる Owner から開いたときだけ出す（app.js の OWNER_MODE） -->
    <a id="cartBtn" class="top-btn cart-btn" href="#cart" aria-label="カート" data-icon="cart"><span class="badge" hidden></span></a>
    <a id="meBtn" class="me-btn" href="#me" aria-label="マイページ" data-icon="user"><span>マイページ</span></a>   <!-- 2026-11-04 ko-dai さんの指示：マイページは右上に -->
    <p id="testBand" class="test-band" hidden>テスト用アカウント<small>Owner から開いたときだけ</small></p>   <!-- app.js の TEST_MEMBER -->
  </header>

  <main id="view"></main>

  <a id="cartbar" class="cartbar" href="#cart" hidden></a>
  <nav class="tabs">
    <!-- 2026-11-04 ko-dai さんの指示（2回目）：ホーム・メニュー・注文・予約・スタンプ・お店。マイページは右上（上の帯の #meBtn）。
         メニューは店内のメニュー（上の切りかえでテイクアウトも見られる）、注文はテイクアウトの注文 -->
    <a href="#home" data-tab="home" data-icon="home"><span>ホーム</span></a>
    <a href="#menu/dine" data-tab="menu" data-icon="menu"><span>メニュー</span></a>
    <a href="#menu" data-tab="order" data-icon="bag"><span>注文</span></a>
    <a href="#reserve" data-tab="reserve" data-icon="cal"><span>予約</span></a>
    <a href="#stamp" data-tab="stamp" data-icon="card"><span>スタンプ</span></a>
    <a href="#shop" data-tab="shop" data-icon="pin"><span>お店</span></a>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-act="close"></div>
  <div class="sheet-body" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
